<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Code Preview</title>

<script src="/Editor/HighLight/highlight.min.js"></script>

<style>
  @font-face {
    font-family: "Google Sans";
    src: url("/Fonts/GoogleSans/GoogleSans-Regular.ttf") format("truetype");
    font-display: swap;
  }

  :root {
    --bg: #0e0e0e;
    --header: #141414;
    --lines-col: #0b0b0b;
    --line: #262626;
    --text: #f0f0f0;
    --text-dim: #8a8a8a;
    --line-num: #4a4a4a;
    --minimap-bg: #0b0b0b;
    --ind-modified: #e8a54c;
    --ind-saved: #52b06a;
    --ind-reverted: #6a9fd8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; outline: 0; }
  html, body { height: 100%; width: 100%; overflow: hidden; }

  body {
    font-family: "Google Sans", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    background: var(--bg);
    user-select: none;
    -webkit-user-select: none;
  }

  .preview { display: flex; flex-direction: column; height: 100%; width: 100%; }

  /* ---------- header ---------- */
  .preview-header {
    flex: 0 0 auto;
    height: 32px;
    display: flex;
    align-items: center;
    padding: 0 6px 0 14px;
    background: var(--header);
    border-bottom: 1px solid var(--line);
    gap: 8px;
  }

  .preview-filename {
    flex: 1;
    font-size: 12.5px;
    color: var(--text);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .preview-actions { display: flex; align-items: center; gap: 2px; }

  .header-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    background: transparent;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    border-radius: 6px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .header-btn:hover { background: #1e1e1e; color: var(--text); }
  .header-btn[disabled] { opacity: .4; cursor: not-allowed; }

  .header-btn .icon {
    display: block;
    width: 14px;
    height: 14px;
    background-color: currentColor;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-position: center;
    -webkit-mask-size: contain;
    mask-size: contain;
    transition: background-color .2s ease;
  }

  .icon-copy {
    -webkit-mask-image: url("/Icons/code_preview_copy.svg");
    mask-image: url("/Icons/code_preview_copy.svg");
  }
  .icon-copy.success {
    -webkit-mask-image: url("/Icons/code_preview_success.svg");
    mask-image: url("/Icons/code_preview_success.svg");
    color: #ffffff;
  }

  .icon-minimap {
    -webkit-mask-image: url("/Icons/code_preview_hide.svg");
    mask-image: url("/Icons/code_preview_hide.svg");
  }
  #toggle-minimap-btn.active .icon-minimap {
    -webkit-mask-image: url("/Icons/code_preview_show.svg");
    mask-image: url("/Icons/code_preview_show.svg");
  }

  /* ---------- body ---------- */
  .preview-body {
    flex: 1;
    display: flex;
    min-height: 0;
    overflow: hidden;
    position: relative;
  }

  /* ---------- placeholder (файл не открыт) ---------- */
  .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    z-index: 4;
  }
  .placeholder-logo {
    width: 260px;
    height: 260px;
    background: url("/Icons/mcode_light.svg") no-repeat center / contain;
    opacity: .38;
    -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,.65) 100%);
    mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,.65) 100%);
    pointer-events: none;
  }
  .placeholder-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 22px;
    background: #17171a;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    border-radius: 12px;
    cursor: pointer;
    transition: background .18s ease, color .18s ease, transform .18s ease;
  }
  .placeholder-btn:hover {
    background: #1e1e22;
    color: var(--text);
    transform: translateY(-1px);
  }
  .placeholder-btn .icon {
    display: block;
    width: 16px;
    height: 16px;
    background-color: currentColor;
    -webkit-mask: url("/Icons/code_preview_enter.svg") no-repeat center / contain;
    mask: url("/Icons/code_preview_enter.svg") no-repeat center / contain;
  }

  .preview-body.has-file .placeholder { display: none; }
  .preview-body:not(.has-file) .editor { display: none; }
  .preview-body:not(.has-file) .minimap { display: none; }

  /* ---------- editor ---------- */
  .editor { flex: 1; display: flex; min-width: 0; min-height: 0; overflow: hidden; }

  .lines-col {
    flex: 0 0 auto;
    width: 82px;
    background: var(--lines-col);
    overflow: hidden;
    position: relative;
    border-right: 1px solid var(--line);
  }

  .lines-inner { padding: 12px 0; will-change: transform; }

  .line-row {
    display: flex;
    align-items: center;
    height: 20px;
    padding: 0 4px 0 8px;
  }

  .line-num {
    flex: 1;
    text-align: right;
    color: var(--line-num);
    font-family: "Consolas", "Cascadia Code", "JetBrains Mono", "Menlo", monospace;
    font-size: 12.5px;
    line-height: 20px;
    user-select: none;
  }

  .line-indicator {
    flex: 0 0 3px;
    width: 3px;
    height: 20px;
    margin-left: 6px;
    background: transparent;
    transition: background .18s ease;
  }
  .line-indicator.modified { background: var(--ind-modified); }
  .line-indicator.saved    { background: var(--ind-saved); }
  .line-indicator.reverted { background: var(--ind-reverted); }

  .fold-btn {
    flex: 0 0 12px;
    width: 12px;
    height: 12px;
    margin-left: 4px;
    position: relative;
    border-radius: 50%;
    border: 1px solid var(--text-dim);
    background: transparent;
    cursor: pointer;
    visibility: hidden;
    transition: background .15s ease, border-color .15s ease;
  }
  .fold-btn.visible { visibility: visible; }
  .fold-btn:hover { border-color: var(--text); }

  .fold-btn::before {
    content: "";
    position: absolute;
    left: 50%; top: 50%;
    width: 6px; height: 1px;
    margin-left: -3px; margin-top: -0.5px;
    background: var(--text-dim);
    transition: transform .15s ease, background .15s ease;
  }
  .fold-btn:hover::before { background: var(--text); }

  .fold-btn.folded::after {
    content: "";
    position: absolute;
    left: 50%; top: 50%;
    width: 1px; height: 6px;
    margin-left: -0.5px; margin-top: -3px;
    background: var(--text-dim);
  }
  .fold-btn.folded:hover::after { background: var(--text); }

  .code-col { flex: 1; position: relative; min-width: 0; overflow: hidden; }

  .hl-layer { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }

  .hl-layer code {
    display: block;
    padding: 12px 16px;
    width: max-content;
    min-width: 100%;
    font-family: "Consolas", "Cascadia Code", "JetBrains Mono", "Menlo", monospace;
    font-size: 13px;
    line-height: 20px;
    white-space: pre;
    background: transparent !important;
    will-change: transform;
  }

  .code-line {
    display: block;
    height: 20px;
    line-height: 20px;
    white-space: pre;
  }
  .code-line.folded { display: none; }

  .code-input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    padding: 12px 16px;
    font-family: "Consolas", "Cascadia Code", "JetBrains Mono", "Menlo", monospace;
    font-size: 13px;
    line-height: 20px;
    color: transparent;
    caret-color: #f0f0f0;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    white-space: pre;
    overflow: auto;
    tab-size: 4;
    user-select: text;
    -webkit-user-select: text;
  }
  .code-input::selection { background: rgba(100, 150, 255, 0.28); }
  .code-input::-webkit-scrollbar { width: 8px; height: 8px; }
  .code-input::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }
  .code-input::-webkit-scrollbar-track { background: transparent; }

  /* ---------- minimap ---------- */
  .minimap {
    position: absolute;
    top: 0;
    right: 0;
    width: 160px;
    height: 160px;
    background: var(--minimap-bg);
    border-left: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    border-bottom-left-radius: 8px;
    overflow: hidden;
    z-index: 6;
    opacity: 1;
    transform: scale(1);
    transform-origin: top right;
    transition: opacity .25s ease, transform .25s ease;
  }
  .minimap.minimap-hidden {
    opacity: 0;
    transform: scale(.94);
    pointer-events: none;
  }

  .minimap-content {
    position: absolute;
    top: 0; left: 0;
    margin: 0;
    transform-origin: top left;
    pointer-events: none;
    opacity: 0.85;
    padding: 8px 4px;
    overflow: hidden;
  }
  .minimap-content code {
    display: block;
    font-family: "Consolas", "Cascadia Code", "JetBrains Mono", "Menlo", monospace;
    font-size: 13px;
    line-height: 20px;
    white-space: pre;
    background: transparent !important;
    padding: 0 !important;
  }
  .minimap-content .code-line {
    display: block;
    height: 20px;
    line-height: 20px;
  }

  .minimap-viewport {
    position: absolute;
    left: 0; right: 0;
    border: 1px solid rgba(255,255,255,.28);
    background: rgba(255,255,255,.06);
    pointer-events: auto;
    cursor: grab;
    box-sizing: border-box;
    transition: background .15s ease, border-color .15s ease;
  }
  .minimap-viewport:hover {
    background: rgba(255,255,255,.12);
    border-color: rgba(255,255,255,.45);
  }
  .minimap-viewport.dragging {
    cursor: grabbing;
    background: rgba(255,255,255,.16);
  }

  /* ---------- toast ---------- */
  #toast {
    position: absolute;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%) translateY(10px);
    padding: 8px 16px;
    background: #1f1f23;
    color: #e0e0e0;
    font-size: 12px;
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 50;
    white-space: nowrap;
    max-width: 90%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- hljs theme ---------- */
  .hljs { color: #abb2bf; background: transparent; }
  .hljs-comment, .hljs-quote { color: #5c6370; font-style: italic; }
  .hljs-doctag, .hljs-keyword, .hljs-formula { color: #c678dd; }
  .hljs-section, .hljs-name, .hljs-selector-tag, .hljs-deletion, .hljs-subst { color: #e06c75; }
  .hljs-literal { color: #56b6c2; }
  .hljs-string, .hljs-regexp, .hljs-addition, .hljs-attribute, .hljs-meta .hljs-string { color: #98c379; }
  .hljs-attr, .hljs-variable, .hljs-template-variable, .hljs-type, .hljs-selector-class, .hljs-selector-attr, .hljs-selector-pseudo, .hljs-number { color: #d19a66; }
  .hljs-symbol, .hljs-bullet, .hljs-link, .hljs-meta, .hljs-selector-id, .hljs-title { color: #61aeee; }
  .hljs-built_in, .hljs-title.class_, .hljs-class .hljs-title { color: #e6c07b; }
  .hljs-emphasis { font-style: italic; }
  .hljs-strong { font-weight: bold; }
  .hljs-link { text-decoration: underline; }
</style>
</head>
<body>

<div class="preview">
  <div class="preview-header">
    <span class="preview-filename" id="filename">—</span>
    <div class="preview-actions">
      <button class="header-btn" id="copy-btn" title="Copy">
        <i class="icon icon-copy" id="copy-icon"></i>
        <span>Copy</span>
      </button>
      <button class="header-btn" id="toggle-minimap-btn" title="Minimap">
        <i class="icon icon-minimap"></i>
        <span>Minimap</span>
      </button>
    </div>
  </div>
  <div class="preview-body" id="preview-body">
    <div class="placeholder">
      <div class="placeholder-logo"></div>
      <button class="placeholder-btn" id="create-file-btn">
        <i class="icon"></i>
        <span>Create new file</span>
      </button>
    </div>

    <div class="editor">
      <div class="lines-col" id="lines-col">
        <div class="lines-inner" id="lines-inner"></div>
      </div>
      <div class="code-col">
        <pre class="hl-layer" id="hl-layer"><code class="hljs" id="hl-code"></code></pre>
        <textarea
          class="code-input"
          id="code-input"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
          wrap="off"
        ></textarea>
      </div>
    </div>

    <div class="minimap minimap-hidden" id="minimap">
      <pre class="minimap-content" id="minimap-content"><code class="hljs" id="minimap-code"></code></pre>
      <div class="minimap-viewport" id="minimap-viewport"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  window.parent.postMessage({ __toolReady: true }, "*");

  // ---------- мост ----------
  let reqCounter = 0;
  const pending = new Map();

  function request(action, params = {}) {
    const reqId = ++reqCounter;
    return new Promise(resolve => {
      pending.set(reqId, resolve);
      window.parent.postMessage(
        { __toolRequest: true, action, reqId, ...params }, "*");
    });
  }

  // ---------- элементы ----------
  const filenameEl      = document.getElementById("filename");
  const codeInput       = document.getElementById("code-input");
  const hlCode          = document.getElementById("hl-code");
  const linesInner      = document.getElementById("lines-inner");
  const minimap         = document.getElementById("minimap");
  const minimapContent  = document.getElementById("minimap-content");
  const minimapCode     = document.getElementById("minimap-code");
  const minimapViewport = document.getElementById("minimap-viewport");
  const previewBody     = document.getElementById("preview-body");
  const copyBtn         = document.getElementById("copy-btn");
  const copyIcon        = document.getElementById("copy-icon");
  const toggleMinimapBtn = document.getElementById("toggle-minimap-btn");
  const toastEl         = document.getElementById("toast");

  // ---------- состояние ----------
  let currentPath = null;
  let currentName = "";
  let originalContent = "";
  let savedContent = "";

  const undoStack = [];
  const redoStack = [];
  const MAX_UNDO = 300;

  let minimapVisible = false;
  let minimapScale = 1;
  let minimapAllowed = false;

  const MIN_MINIMAP_LINES = 100;
  const MAX_MINIMAP_LINES = 500;

  let folds = [];
  const collapsedStarts = new Set();

  // ---------- toast ----------
  let toastTimer = null;
  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 3200);
  }

  // ---------- утилиты ----------
  const extToLang = {
    js: "javascript", mjs: "javascript", cjs: "javascript",
    ts: "typescript", jsx: "javascript", tsx: "typescript",
    py: "python", pyw: "python",
    java: "java", kt: "kotlin", kts: "kotlin",
    cs: "csharp",
    cpp: "cpp", cc: "cpp", cxx: "cpp", hpp: "cpp", hh: "cpp",
    c: "c", h: "c",
    go: "go", rs: "rust", rb: "ruby", php: "php",
    swift: "swift", m: "objectivec", mm: "objectivec",
    scala: "scala",
    sh: "bash", bash: "bash", zsh: "bash",
    bat: "dos", cmd: "dos", ps1: "powershell",
    html: "xml", htm: "xml", xhtml: "xml",
    xml: "xml", svg: "xml",
    css: "css", scss: "scss", sass: "scss", less: "less",
    json: "json", jsonc: "json",
    yml: "yaml", yaml: "yaml",
    toml: "ini", ini: "ini", cfg: "ini", conf: "ini",
    md: "markdown", markdown: "markdown",
    sql: "sql", lua: "lua",
    pl: "perl", pm: "perl",
    r: "r", dart: "dart", groovy: "groovy",
    hs: "haskell", elm: "elm",
    ex: "elixir", exs: "elixir", erl: "erlang",
    clj: "clojure", cljs: "clojure",
    fs: "fsharp", fsx: "fsharp",
    vb: "vbnet",
    v: "verilog", sv: "verilog", svh: "verilog", vhd: "vhdl",
    tex: "latex", proto: "protobuf",
    graphql: "graphql", gql: "graphql",
    vue: "xml"
  };

  function getLang(path) {
    if (!path) return null;
    const idx = path.lastIndexOf(".");
    if (idx < 0) return null;
    return extToLang[path.substring(idx + 1).toLowerCase()] || null;
  }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function splitHighlightedIntoLines(html) {
    const lines = [];
    const openStack = [];
    let buffer = "";
    const tokens = html.split(/(<[^>]+>|\n)/);

    for (const token of tokens) {
      if (token === "\n") {
        const closing = openStack.slice().reverse().map(t => `</${t}>`).join("");
        lines.push(buffer + closing);
        buffer = openStack.map(t => `<${t}>`).join("");
      } else if (token.startsWith("</")) {
        const name = token.match(/<\/([a-zA-Z][\w-]*)/);
        if (name) {
          const idx = openStack.lastIndexOf(name[1]);
          if (idx >= 0) openStack.splice(idx, 1);
        }
        buffer += token;
      } else if (token.startsWith("<")) {
        const match = token.match(/^<([a-zA-Z][\w-]*)/);
        if (match) openStack.push(match[1]);
        buffer += token;
      } else {
        buffer += token;
      }
    }
    if (buffer || lines.length === 0) {
      const closing = openStack.slice().reverse().map(t => `</${t}>`).join("");
      lines.push(buffer + closing);
    }
    return lines;
  }

  // ---------- подсветка ----------
  function renderHighlight() {
    const content = codeInput.value;
    const lang = getLang(currentPath);
    let html = "";

    try {
      if (window.hljs && lang && hljs.getLanguage(lang)) {
        hlCode.className = "hljs language-" + lang;
        html = hljs.highlight(content, { language: lang, ignoreIllegals: true }).value;
      } else if (window.hljs) {
        hlCode.className = "hljs";
        html = hljs.highlightAuto(content).value;
      } else {
        hlCode.className = "hljs";
        html = escapeHtml(content);
      }
    } catch {
      hlCode.className = "hljs";
      html = escapeHtml(content);
    }

    const lines = splitHighlightedIntoLines(html);
    hlCode.innerHTML = lines
      .map((l, i) => `<div class="code-line" data-line="${i}">${l || "\u00A0"}</div>`)
      .join("");
  }

  // ---------- gutter ----------
  function renderGutter(lineCount) {
    const cur = linesInner.children.length;
    if (cur < lineCount) {
      for (let i = cur; i < lineCount; i++) {
        const row = document.createElement("div");
        row.className = "line-row";
        row.dataset.line = String(i);
        row.innerHTML =
          `<span class="line-num">${i + 1}</span>` +
          `<span class="line-indicator"></span>` +
          `<span class="fold-btn" data-line="${i}"></span>`;
        linesInner.appendChild(row);
      }
    } else if (cur > lineCount) {
      for (let i = cur - 1; i >= lineCount; i--) linesInner.removeChild(linesInner.lastChild);
    }
    for (let i = 0; i < lineCount; i++) {
      const num = linesInner.children[i].querySelector(".line-num");
      const expected = String(i + 1);
      if (num.textContent !== expected) num.textContent = expected;
    }
  }

  // ---------- индикаторы ----------
  function updateLineIndicators() {
    const curLines = codeInput.value.split("\n");
    const savedLines = savedContent.split("\n");
    const origLines = originalContent.split("\n");
    const count = curLines.length;

    renderGutter(count);

    for (let i = 0; i < count; i++) {
      const cur = curLines[i];
      const saved = savedLines[i];
      const orig = origLines[i];

      const sameAsSaved = cur === saved;
      const sameAsOrig = cur === orig;
      const savedChanged = saved !== orig;

      let status = "none";
      if (sameAsSaved && savedChanged) status = "saved";
      else if (sameAsSaved) status = "none";
      else if (sameAsOrig && savedChanged) status = "reverted";
      else if (sameAsOrig) status = "none";
      else status = "modified";

      const ind = linesInner.children[i].querySelector(".line-indicator");
      ind.classList.toggle("modified", status === "modified");
      ind.classList.toggle("saved",    status === "saved");
      ind.classList.toggle("reverted", status === "reverted");
    }
  }

  // ---------- folding ----------
  function computeFolds(text) {
    const out = [];
    const stack = [];
    let line = 0;
    for (let i = 0; i < text.length; i++) {
      const c = text.charCodeAt(i);
      if (c === 10) { line++; continue; }
      if (c === 123 || c === 40 || c === 91) stack.push({ ch: c, line });
      else if (c === 125 || c === 41 || c === 93) {
        const open = stack.pop();
        if (!open) continue;
        if (open.line < line) out.push({ start: open.line, end: line });
      }
    }
    return out;
  }

  function recomputeFolds() {
    folds = computeFolds(codeInput.value);
    for (const s of [...collapsedStarts]) {
      if (!folds.some(f => f.start === s)) collapsedStarts.delete(s);
    }
  }

  function updateFoldButtons() {
    linesInner.querySelectorAll(".fold-btn").forEach(b => {
      b.classList.remove("visible", "folded");
    });
    for (const f of folds) {
      const row = linesInner.children[f.start];
      if (!row) continue;
      const btn = row.querySelector(".fold-btn");
      if (!btn) continue;
      btn.classList.add("visible");
      if (collapsedStarts.has(f.start)) btn.classList.add("folded");
    }
    applyFoldedClasses();
  }

  function applyFoldedClasses() {
    const hidden = new Set();
    for (const f of folds) {
      if (!collapsedStarts.has(f.start)) continue;
      for (let i = f.start + 1; i < f.end; i++) hidden.add(i);
    }

    const rows = linesInner.children;
    for (let i = 0; i < rows.length; i++)
      rows[i].classList.toggle("folded", hidden.has(i));

    const codeLines = hlCode.children;
    for (let i = 0; i < codeLines.length; i++)
      codeLines[i].classList.toggle("folded", hidden.has(i));
  }

  function toggleFold(line) {
    if (collapsedStarts.has(line)) collapsedStarts.delete(line);
    else collapsedStarts.add(line);
    updateFoldButtons();
  }

  linesInner.addEventListener("click", e => {
    const btn = e.target.closest(".fold-btn");
    if (!btn) return;
    const line = parseInt(btn.dataset.line, 10);
    if (isNaN(line)) return;
    toggleFold(line);
  });

  // ---------- refresh ----------
  function refreshView() {
    renderHighlight();
    updateLineIndicators();
    updateFoldButtons();
    updateMinimap();
  }

  // ---------- scroll ----------
  function syncScroll() {
    const sx = codeInput.scrollLeft;
    const sy = codeInput.scrollTop;
    hlCode.style.transform = `translate(${-sx}px, ${-sy}px)`;
    linesInner.style.transform = `translateY(${-sy}px)`;
    updateMinimapViewport();
  }
  codeInput.addEventListener("scroll", syncScroll);

  // ---------- undo/redo ----------
  const undoState = { suppress: false };

  function pushUndo(prev) {
    if (undoState.suppress) return;
    if (undoStack.length && undoStack[undoStack.length - 1] === prev) return;
    undoStack.push(prev);
    if (undoStack.length > MAX_UNDO) undoStack.shift();
    redoStack.length = 0;
  }

  let lastContent = "";

  function applyContent(content) {
    undoState.suppress = true;
    codeInput.value = content;
    undoState.suppress = false;
    lastContent = content;
    recomputeFolds();
    refreshView();
  }

  function undo() {
    if (!undoStack.length) return;
    const cur = codeInput.value;
    const prev = undoStack.pop();
    redoStack.push(cur);
    applyContent(prev);
  }

  function redo() {
    if (!redoStack.length) return;
    const cur = codeInput.value;
    const next = redoStack.pop();
    undoStack.push(cur);
    applyContent(next);
  }

  // ---------- ввод ----------
  codeInput.addEventListener("input", () => {
    const cur = codeInput.value;
    if (cur !== lastContent) {
      pushUndo(lastContent);
      lastContent = cur;
    }
    if (collapsedStarts.size > 0) collapsedStarts.clear();
    recomputeFolds();
    refreshView();
  });

  codeInput.addEventListener("keydown", e => {
    const ctrl = e.ctrlKey || e.metaKey;

    if (ctrl && e.key.toLowerCase() === "s" && !e.shiftKey) { e.preventDefault(); saveFile(); return; }
    if (ctrl && e.key.toLowerCase() === "z" && !e.shiftKey) { e.preventDefault(); undo(); return; }
    if (ctrl && (e.key.toLowerCase() === "y" ||
                (e.key.toLowerCase() === "z" && e.shiftKey))) { e.preventDefault(); redo(); return; }

    if (e.key === "Tab") {
      e.preventDefault();
      const start = codeInput.selectionStart;
      const end = codeInput.selectionEnd;
      const before = codeInput.value;
      codeInput.value = before.substring(0, start) + "    " + before.substring(end);
      codeInput.selectionStart = codeInput.selectionEnd = start + 4;
      pushUndo(before);
      lastContent = codeInput.value;
      recomputeFolds();
      refreshView();
      return;
    }
  });

  // ---------- сохранение ----------
  async function saveFile() {
    if (!currentPath) return;
    const content = codeInput.value;
    const res = await request("save-file", { path: currentPath, content });
    if (res && res.error) { console.warn("save-file:", res.error); return; }
    savedContent = content;
    updateLineIndicators();
  }

  // ---------- minimap ----------
  function updateMinimapAvailability(lineCount) {
    minimapAllowed = lineCount >= MIN_MINIMAP_LINES && lineCount <= MAX_MINIMAP_LINES;

    if (!minimapAllowed) {
      setMinimapVisible(false);
      if (lineCount < MIN_MINIMAP_LINES) {
        showToast(`Minimap is only available for files with ${MIN_MINIMAP_LINES}–${MAX_MINIMAP_LINES} lines (this file has ${lineCount}).`);
      } else if (lineCount > MAX_MINIMAP_LINES) {
        showToast(`Minimap is disabled for files over ${MAX_MINIMAP_LINES} lines (this file has ${lineCount}).`);
      }
      toggleMinimapBtn.setAttribute("disabled", "");
    } else {
      toggleMinimapBtn.removeAttribute("disabled");
    }
  }

  function setMinimapVisible(visible) {
    if (!minimapAllowed && visible) return;
    minimapVisible = visible;
    minimap.classList.toggle("minimap-hidden", !visible);
    toggleMinimapBtn.classList.toggle("active", visible);
    if (visible) setTimeout(() => updateMinimap(), 40);
  }

  toggleMinimapBtn.addEventListener("click", () => {
    if (!minimapAllowed) {
      const lc = codeInput.value.split("\n").length;
      if (lc < MIN_MINIMAP_LINES) {
        showToast(`Minimap is only available for files with ${MIN_MINIMAP_LINES}–${MAX_MINIMAP_LINES} lines (this file has ${lc}).`);
      } else {
        showToast(`Minimap is disabled for files over ${MAX_MINIMAP_LINES} lines (this file has ${lc}).`);
      }
      return;
    }
    setMinimapVisible(!minimapVisible);
  });

  function updateMinimap() {
    if (!minimapVisible || !minimapAllowed) return;

    minimapCode.innerHTML = hlCode.innerHTML;

    const contentHeight = hlCode.scrollHeight || codeInput.scrollHeight;
    const minimapHeight = minimap.clientHeight;
    if (contentHeight <= 0 || minimapHeight <= 0) return;

    minimapScale = Math.min(1, minimapHeight / contentHeight);
    minimapContent.style.transform = `scale(${minimapScale})`;
    minimapContent.style.width = `${minimap.clientWidth / minimapScale}px`;

    updateMinimapViewport();
  }

  function updateMinimapViewport() {
    if (!minimapVisible || !minimapAllowed) return;
    const total = codeInput.scrollHeight;
    if (total <= 0) return;
    const mh = minimap.clientHeight;
    if (mh <= 0) return;

    const s = mh / total;
    minimapViewport.style.top = (codeInput.scrollTop * s) + "px";
    minimapViewport.style.height = Math.max(6, codeInput.clientHeight * s) + "px";
  }

  minimapViewport.addEventListener("mousedown", e => {
    if (e.button !== 0) return;
    e.preventDefault();
    minimapViewport.classList.add("dragging");
    const startY = e.clientY;
    const startScroll = codeInput.scrollTop;
    const s = minimapScale > 0 ? minimapScale : 1;
    const onMove = ev => {
      const dy = ev.clientY - startY;
      codeInput.scrollTop = startScroll + dy / s;
    };
    const onUp = () => {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      minimapViewport.classList.remove("dragging");
    };
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });

  minimap.addEventListener("mousedown", e => {
    if (e.target === minimapViewport || minimapViewport.contains(e.target)) return;
    if (e.button !== 0) return;
    const r = minimap.getBoundingClientRect();
    const ratio = (e.clientY - r.top) / r.height;
    codeInput.scrollTop = ratio * codeInput.scrollHeight - codeInput.clientHeight / 2;
    e.preventDefault();
  });

  // ---------- copy ----------
  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(codeInput.value);
      copyIcon.classList.add("success");
      setTimeout(() => copyIcon.classList.remove("success"), 1200);
    } catch (err) { console.warn("clipboard:", err); }
  });

  // ---------- placeholder: create new file ----------
  document.getElementById("create-file-btn").addEventListener("click", () => {
    showToast("Stub: Create new file");
  });

  // ---------- показ файла ----------
  function showCode(path, name, content) {
    currentPath = path;
    currentName = name || path || "—";
    filenameEl.textContent = currentName;

    content = content || "";
    originalContent = content;
    savedContent = content;

    codeInput.value = content;
    lastContent = content;

    undoStack.length = 0;
    redoStack.length = 0;
    collapsedStarts.clear();

    previewBody.classList.add("has-file");

    recomputeFolds();
    refreshView();

    codeInput.scrollTop = 0;
    codeInput.scrollLeft = 0;
    syncScroll();

    const lineCount = content.split("\n").length;
    updateMinimapAvailability(lineCount);
  }

  // ---------- приём сообщений ----------
  window.addEventListener("message", e => {
    const msg = e.data;
    if (!msg) return;

    if (msg.__toolReply) {
      const res = pending.get(msg.reqId);
      if (res) { pending.delete(msg.reqId); res(msg.payload); }
      return;
    }
    if (msg.__toolInit && msg.data && typeof msg.data.content === "string") {
      showCode(msg.data.path, msg.data.name, msg.data.content);
      return;
    }
    if (msg.__codePreviewShow) {
      showCode(msg.path, msg.name, msg.content);
      return;
    }
  });

  // ---------- resize ----------
  const ro = new ResizeObserver(() => {
    syncScroll();
    updateMinimap();
  });
  ro.observe(previewBody);

  // ---------- старт ----------
  hlCode.innerHTML = `<div class="code-line">&nbsp;</div>`;
  renderGutter(1);
</script>
</body>
</html>
