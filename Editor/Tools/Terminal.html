<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<style>
  * { box-sizing:border-box; margin:0; padding:0; border:0; outline:0; }
  html, body { height:100%; width:100%; overflow:hidden; }
  body {
    font-family: "Consolas", "Lucida Console", "Courier New", monospace;
    background:#0c0c0c;
    color:#cccccc;
    font-size:14px;
    line-height:1.25;
    display:flex;
    flex-direction:column;
    user-select:text;
    -webkit-user-select:text;
  }
  #output {
    flex:1;
    padding:8px 12px 4px 12px;
    overflow-y:auto;
    white-space:pre-wrap;
    word-break:break-word;
    scrollbar-width:thin;
    scrollbar-color:#2a2a2a transparent;
  }
  #output::-webkit-scrollbar { width:10px; height:10px; }
  #output::-webkit-scrollbar-track { background:transparent; }
  #output::-webkit-scrollbar-thumb { background:#2a2a2a; border-radius:5px; }
  #output::-webkit-scrollbar-thumb:hover { background:#3a3a3a; }

  .line { display:block; white-space:pre-wrap; word-break:break-word; }

  #inputLine {
    display:flex;
    align-items:center;
    padding:0 12px 10px 12px;
    flex:0 0 auto;
  }
  #prompt {
    color:#cccccc;
    white-space:pre;
    user-select:none;
  }
  #cmd {
    flex:1;
    background:transparent;
    color:#cccccc;
    font-family:inherit;
    font-size:inherit;
    line-height:inherit;
    padding:0 0 0 0;
    margin-left:2px;
    caret-color:#cccccc;
  }
  #cmd::selection { background:#264f78; }

  /* ── AI command blocks ───────────────────────────────── */
  .ai-cmd-block{margin:10px 0 6px;padding:8px 12px;border-left:2px solid #4a7ab8;background:rgba(74,122,184,.06);border-radius:4px;transition:background .35s ease}
  .ai-cmd-block.ai-cmd-flash{animation:celarAiFlash 1.2s ease}
  @keyframes celarAiFlash{0%{background:rgba(74,122,184,.45)}100%{background:rgba(74,122,184,.06)}}
  .ai-cmd-header{color:#8ab4e8;font-weight:600;white-space:pre-wrap;word-break:break-word}
  .ai-cmd-cwd{color:#6a6a6a;font-size:12px;margin-top:2px}
  .ai-cmd-body{margin-top:4px;padding-left:8px}
  .ai-cmd-line{white-space:pre-wrap;word-break:break-word;color:#cccccc}
  .ai-cmd-line.err{color:#e06c75}
  .ai-cmd-footer{margin-top:6px;color:#8a8a8a;font-size:12px;font-style:italic}
  .ai-cmd-footer.ok{color:#7dc97d}
  .ai-cmd-footer.fail{color:#e06c75}
</style>
</head>
<body>

<div id="output"></div>
<div id="inputLine">
  <span id="prompt">PS C:\&gt;</span>
  <input id="cmd" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" />
</div>

<script>
  window.parent.postMessage({ __toolReady: true }, "*");

  const outputEl = document.getElementById("output");
  const promptEl = document.getElementById("prompt");
  const cmdEl    = document.getElementById("cmd");

  let bannerShown = false;
  let cwd = "";
  let history = [];
  let histIndex = -1;

  function setPrompt() {
    promptEl.textContent = "PS " + (cwd || "") + ">";
  }

  function appendText(text) {
    if (text === undefined || text === null) return;
    const s = String(text);
    const lines = s.split(/\r?\n/);
    for (const ln of lines) {
      const el = document.createElement("span");
      el.className = "line";
      el.textContent = ln.length === 0 ? "\u00A0" : ln;
      outputEl.appendChild(el);
    }
    outputEl.scrollTop = outputEl.scrollHeight;
  }

  function appendEcho(cmdText) {
    const el = document.createElement("span");
    el.className = "line";
    el.textContent = "PS " + (cwd || "") + ">" + cmdText;
    outputEl.appendChild(el);
    outputEl.scrollTop = outputEl.scrollHeight;
  }

  function showBannerOnce() {
    if (bannerShown) return;
    bannerShown = true;
    appendText("");
    appendText("Windows PowerShell");
    appendText("Copyright (C) Microsoft Corporation. All rights reserved.");
    appendText("");
    appendText("Try the new cross-platform PowerShell https://aka.ms/pscore6");
    appendText("");
  }

  // ---------- приём от C# ----------
  window.addEventListener("message", e => {
    const msg = e.data;
    if (!msg) return;
    if (msg.__setting === "terminal.fontSize") {
      const px = Number(msg.value) || 14;
      document.body.style.fontSize = px + "px";
      return;
    }
    if (!msg.__toolPush) return;
    const p = msg.payload;
    if (!p) return;

    // NEW: AI command events
    if (p.type === "ai-command-event") { handleAiCommandEvent(p); return; }
    if (p.type === "scroll-to-ai") { scrollToLastAi(); return; }

    if (p.type !== "terminal-output") return;
    const data = p.data == null ? "" : String(p.data);

    // маркер CWD — не показываем, обновляем prompt
    const m = data.match(/__MYTHIC_CWD__:(.*)$/);
    if (m) {
      cwd = m[1].trim();
      setPrompt();
      return;
    }
    // маркер баннера
    if (data.indexOf("__MYTHIC_BANNER__") >= 0) {
      showBannerOnce();
      return;
    }

    appendText(data);
  });

  // ---------- AI command feed ----------
  let currentAiBlock = null;   // { block, body, footer } — куда стримить stdout
  let lastAiBlock    = null;   // DOM-узел последнего блока — для scroll-to-ai

  function aiMaybeAutoScroll(){
    // Скроллим вниз, только если пользователь и так уже был у низа.
    const nearBottom = outputEl.scrollHeight - outputEl.scrollTop - outputEl.clientHeight < 120;
    if(nearBottom) outputEl.scrollTop = outputEl.scrollHeight;
  }

  function handleAiCommandEvent(ev){
    if(!ev) return;
    if(ev.phase === "start"){
      const block = document.createElement("div");
      block.className = "ai-cmd-block";
      const header = document.createElement("div");
      header.className = "ai-cmd-header";
      header.textContent = "[AI] \u25B6 " + (ev.text || "");
      block.appendChild(header);
      if(ev.cwd){
        const cwdEl = document.createElement("div");
        cwdEl.className = "ai-cmd-cwd";
        cwdEl.textContent = "cwd: " + ev.cwd;
        block.appendChild(cwdEl);
      }
      const body = document.createElement("div");
      body.className = "ai-cmd-body";
      block.appendChild(body);
      const footer = document.createElement("div");
      footer.className = "ai-cmd-footer";
      footer.textContent = "[AI] running\u2026";
      block.appendChild(footer);

      outputEl.appendChild(block);
      currentAiBlock = { block, body, footer };
      lastAiBlock    = block;
      aiMaybeAutoScroll();
    }
    else if(ev.phase === "stdout" || ev.phase === "stderr"){
      if(!currentAiBlock){
        // Прилетел вывод без start (маловероятно, но обработаем):
        const block = document.createElement("div");
        block.className = "ai-cmd-block";
        const body = document.createElement("div");
        body.className = "ai-cmd-body";
        block.appendChild(body);
        outputEl.appendChild(block);
        currentAiBlock = { block, body, footer: null };
        lastAiBlock = block;
      }
      const ln = document.createElement("div");
      ln.className = "ai-cmd-line" + (ev.phase === "stderr" ? " err" : "");
      ln.textContent = ev.text || "";
      currentAiBlock.body.appendChild(ln);
      aiMaybeAutoScroll();
    }
    else if(ev.phase === "exit"){
      if(currentAiBlock && currentAiBlock.footer){
        const code = ev.exit | 0;
        let txt;
        if(code === 0)      txt = "[AI] \u2713 exit 0";
        else if(code  > 0)  txt = "[AI] \u2717 exit " + code;
        else                txt = "[AI] \u2717 error";
        if(ev.text) txt += " (" + ev.text + ")";
        currentAiBlock.footer.textContent = txt;
        currentAiBlock.footer.className = "ai-cmd-footer " + (code === 0 ? "ok" : "fail");
      }
      currentAiBlock = null;
      aiMaybeAutoScroll();
    }
  }

  function scrollToLastAi(){
    if(!lastAiBlock){ appendText("[no AI commands yet]"); return; }
    try{ lastAiBlock.scrollIntoView({ behavior: "smooth", block: "start" }); }catch(_){}
    lastAiBlock.classList.remove("ai-cmd-flash");
    void lastAiBlock.offsetWidth;
    lastAiBlock.classList.add("ai-cmd-flash");
    setTimeout(() => { try { lastAiBlock.classList.remove("ai-cmd-flash"); } catch(_){} }, 1300);
  }

  // ---------- старт ----------
  setPrompt();
  window.parent.postMessage({
    __toolRequest: true,
    action: "terminal-start",
    reqId: 0
  }, "*");

  // ---------- ввод ----------
  cmdEl.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      const line = cmdEl.value;
      cmdEl.value = "";
      appendEcho(" " + line);
      if (line.trim()) {
        history.push(line);
        histIndex = history.length;
        window.parent.postMessage({
          __toolRequest: true,
          action: "terminal-write",
          reqId: 0,
          line
        }, "*");
      } else {
        // пустой Enter — просто новая строка (эмулируем поведение)
        appendText("");
      }
      return;
    }
    // стрелка вверх/вниз — история
    if (e.key === "ArrowUp") {
      if (history.length === 0) return;
      e.preventDefault();
      if (histIndex > 0) histIndex--;
      cmdEl.value = history[histIndex] || "";
      setTimeout(() => cmdEl.setSelectionRange(cmdEl.value.length, cmdEl.value.length), 0);
      return;
    }
    if (e.key === "ArrowDown") {
      if (history.length === 0) return;
      e.preventDefault();
      if (histIndex < history.length - 1) histIndex++;
      else histIndex = history.length;
      cmdEl.value = history[histIndex] || "";
      setTimeout(() => cmdEl.setSelectionRange(cmdEl.value.length, cmdEl.value.length), 0);
      return;
    }
  });

  // ---------- фокус ----------
  setTimeout(() => cmdEl.focus(), 100);
  document.body.addEventListener("click", () => cmdEl.focus());
  window.addEventListener("focus", () => cmdEl.focus());
</script>
</body>
</html>
